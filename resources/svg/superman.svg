<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <!-- original mark: cape-swoosh + star, evokes "flight/super" without reproducing any trademarked emblem -->
    <style>
        @media (prefers-reduced-motion: no-preference) {
            .u-sm-cape {
                transform-box: fill-box;
                transform-origin: center;
                animation: u-sm-swoop 2.2s ease-in-out infinite;
            }
            .u-sm-star {
                transform-box: fill-box;
                transform-origin: center;
                animation: u-sm-twinkle 2.2s ease-in-out infinite;
            }
            @keyframes u-sm-swoop {
                0%, 100% { transform: translateX(0); opacity: 1; }
                50% { transform: translateX(1px); opacity: 0.8; }
            }
            @keyframes u-sm-twinkle {
                0%, 100% { opacity: 0.6; transform: scale(0.9); }
                50% { opacity: 1; transform: scale(1.15); }
            }
        }
    </style>
    <path class="u-sm-cape" d="M6 5c3 2 3 12 0 14 5-1 9-1 12 0 3-2 3-12 0-14-3 3-9 3-12 0z"
          stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
    <path class="u-sm-star" d="M12 8.6l.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3.9-1.9z"
          fill="currentColor" />
</svg>
